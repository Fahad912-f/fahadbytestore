<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FahadByte — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090c; --panel:#0f1216; --panel-2:#141821;
    --line:#22262f; --chalk:#eceae4; --chalk-dim:#8a8f99;
    --gold:#c9a227; --gold-bright:#e0b93a;
    --mono:'JetBrains Mono', monospace; --display:'Space Grotesk', sans-serif; --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--chalk); font-family:var(--body); }
  .wrap{ max-width:900px; margin:0 auto; padding:24px 18px 60px; }
  .logo{ font-family:var(--display); font-weight:700; font-size:19px; margin-bottom:24px; }
  .logo span{ color:var(--gold); }

  .login-box{ max-width:360px; margin:80px auto; padding:28px; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .login-box h2{ font-family:var(--display); font-size:18px; margin-bottom:16px; }
  .form-input, select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px 12px; color:var(--chalk); font-size:13px; margin-bottom:10px; font-family:var(--body); }
  .btn{ width:100%; padding:11px; background:var(--gold); color:var(--bg); border:none; border-radius:7px; font-weight:700; font-size:13px; cursor:pointer; }
  .error{ color:#e0453f; font-size:12px; margin-top:8px; display:none; }

  .top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
  .nav-tabs{ display:flex; gap:10px; margin-bottom:20px; }
  .tab-btn{ background:var(--panel); border:1px solid var(--line); color:var(--chalk-dim); padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; font-size:13px; }
  .tab-btn.active{ border-color:var(--gold); color:var(--gold-bright); }

  .stat-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:24px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat-num{ font-family:var(--display); font-size:17px; font-weight:700; color:var(--gold-bright); }
  .stat-label{ font-size:10px; color:var(--chalk-dim); font-family:var(--mono); margin-top:4px; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
  .card-top{ display:flex; justify-content:space-between; align-items:start; margin-bottom:8px; gap:10px; }
  .order-id{ font-family:var(--mono); font-size:11px; color:var(--gold); }
  .action-btn{ padding:7px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; border:none; }
  .approve-btn{ background:var(--gold); color:var(--bg); }
  .delete-btn{ background:#3a0f0f; color:#f87171; border:1px solid #5c1d1d; }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <h2>FahadByte Admin</h2>
  <input type="email" class="form-input" id="loginEmail" placeholder="Admin email">
  <input type="password" class="form-input" id="loginPassword" placeholder="Password">
  <button class="btn" id="loginBtn">Log In</button>
  <p class="error" id="loginError"></p>
</div>

<div id="adminScreen" class="wrap" style="display:none;">
  <div class="top-bar">
    <div class="logo">Fahad<span>Byte</span> · Control Center</div>
    <button class="action-btn delete-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('orders')">📦 Orders &amp; Sales</button>
    <button class="tab-btn" onclick="switchTab('products')">⚙ Manage Services</button>
  </div>

  <!-- ORDERS SECTION -->
  <div id="ordersSection">
    <div class="stat-grid">
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">TOTAL ORDERS</div></div>
      <div class="stat"><div class="stat-num" id="statPending">0</div><div class="stat-label">PENDING</div></div>
      <div class="stat"><div class="stat-num" id="statMonthlyPkr">PKR 0</div><div class="stat-label">THIS MONTH (PKR)</div></div>
      <div class="stat"><div class="stat-num" id="statMonthlyUsd">$0</div><div class="stat-label">THIS MONTH (USD)</div></div>
      <div class="stat"><div class="stat-num" id="statAllTimePkr">PKR 0</div><div class="stat-label">ALL-TIME (PKR)</div></div>
    </div>
    <div id="ordersList"></div>
  </div>

  <!-- PRODUCTS MANAGER SECTION -->
  <div id="productsSection" style="display:none;">
    <div class="card">
      <h3 style="font-family:var(--display); margin-bottom:12px; color:var(--gold);">Add New Service</h3>
      <input type="text" id="pTitle" class="form-input" placeholder="Service Title">
      <textarea id="pDesc" class="form-input" placeholder="Short Description..."></textarea>
      <div class="grid-2">
        <select id="pCategory">
          <option value="digital_app">📱 Digital App / License</option>
          <option value="cv_builder">📝 CV Service</option>
          <option value="manual_service">💼 Custom Development</option>
        </select>
        <input type="number" id="pDiscount" class="form-input" placeholder="Discount % (e.g. 20)">
      </div>
      <div class="grid-2">
        <input type="number" id="pPricePkr" class="form-input" placeholder="Price in PKR">
        <input type="number" id="pPriceUsd" class="form-input" placeholder="Price in USD">
      </div>
      <button class="btn" onclick="saveProduct()">+ Publish Service to Website</button>
    </div>

    <h3 style="font-family:var(--display); margin:20px 0 10px; color:var(--chalk);">Active Services</h3>
    <div id="productsList"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://jtjdrcggbhrbizlukcdz.supabase.co";
const SUPABASE_KEY = "sb_publishable_Xa7kRv1HDV_xN5T1jElFxA_PwbXM-qd";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ADMIN_EMAIL = "ff9224386@gmail.com";
// NOTE: no API keys for email here — sending is handled by a Supabase Edge Function
// (send-order-email) which keeps the Resend key private on the server side.

const loginScreen = document.getElementById('loginScreen');
const adminScreen = document.getElementById('adminScreen');
const loginError = document.getElementById('loginError');

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  loginError.style.display = 'none';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ loginError.textContent = error.message; loginError.style.display = 'block'; return; }
  if(data.user.email !== ADMIN_EMAIL){
    loginError.textContent = "Access denied."; loginError.style.display = 'block';
    await sb.auth.signOut(); return;
  }
  showAdmin();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut(); location.reload();
});

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user.email === ADMIN_EMAIL){ showAdmin(); }
}
checkSession();

function showAdmin(){
  loginScreen.style.display = 'none';
  adminScreen.style.display = 'block';
  loadProducts().then(loadOrders);
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if(tab === 'orders'){
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('ordersSection').style.display = 'block';
    document.getElementById('productsSection').style.display = 'none';
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('ordersSection').style.display = 'none';
    document.getElementById('productsSection').style.display = 'block';
  }
}

// ============ ORDERS ============
let allOrders = [];
let productsMap = {};

async function loadOrders(){
  const { data } = await sb.from('orders').select('*').order('created_at', { ascending: false });
  allOrders = data || [];
  renderOrders();
}

function renderOrders(){
  const list = document.getElementById('ordersList');
  let monthlyPkr = 0, monthlyUsd = 0, allTimePkr = 0, pending = 0;

  const now = new Date();
  const thisMonth = now.getMonth();
  const thisYear = now.getFullYear();

  allOrders.forEach(o => {
    if(o.status === 'pending') pending++;
    if(o.status === 'approved'){
      const price = Number(o.price) || 0;
      allTimePkr += price;

      const orderDate = new Date(o.created_at);
      if(orderDate.getMonth() === thisMonth && orderDate.getFullYear() === thisYear){
        monthlyPkr += price;
        const prod = productsMap[o.product_id];
        if(prod) monthlyUsd += Number(prod.price_usd) || 0;
      }
    }
  });

  document.getElementById('statTotal').textContent = allOrders.length;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statMonthlyPkr').textContent = `PKR ${monthlyPkr.toLocaleString()}`;
  document.getElementById('statMonthlyUsd').textContent = `$${monthlyUsd.toLocaleString()}`;
  document.getElementById('statAllTimePkr').textContent = `PKR ${allTimePkr.toLocaleString()}`;

  list.innerHTML = allOrders.map(o => `
    <div class="card">
      <div class="card-top">
        <div>
          <span class="order-id">#${o.id.slice(0,8)}</span>
          <h4 style="margin-top:2px;">${o.product_title}</h4>
        </div>
        <span style="font-size:11px; padding:3px 8px; border-radius:10px; white-space:nowrap; background:${o.status==='approved'?'#0f3a1f':'#3a2f0a'}; color:${o.status==='approved'?'#4ade80':'#e0b93a'};">${o.status.toUpperCase()}</span>
      </div>
      <div style="font-size:12px; color:var(--chalk-dim);">📧 ${o.customer_email || 'N/A'} | 💰 ${o.currency || 'PKR'} ${o.price} | 💳 ${o.payment_method}</div>
      ${o.payment_proof_url ? `<div style="font-size:12px; margin-top:6px;"><a href="${o.payment_proof_url}" target="_blank" style="color:var(--gold-bright);">🧾 View payment screenshot</a></div>` : ''}
      ${o.status === 'pending' ? `<button class="action-btn approve-btn" style="margin-top:10px; width:100%;" onclick="approveOrder('${o.id}', '${o.customer_email}', '${(o.product_title||'').replace(/'/g,"\\'")}', '${o.product_id || ''}')">✓ Approve Order &amp; Send Email</button>` : ''}
    </div>
  `).join('');
}

async function approveOrder(id, email, title, productId){
  await sb.from('orders').update({ status: 'approved' }).eq('id', id);

  // Increment sold_count
  if(productId){
    const { data: p } = await sb.from('products').select('sold_count').eq('id', productId).single();
    if(p){ await sb.from('products').update({ sold_count: (p.sold_count || 0) + 1 }).eq('id', productId); }
  }

  // Send email via secure Edge Function (Resend key stays server-side, never exposed here)
  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-order-email`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ email, title })
    });
    const result = await res.json();
    if(result.success) alert('Order approved, email sent & sold count updated!');
    else alert('Order approved, but email failed — please follow up manually.');
  } catch(e){
    alert('Order approved! (Email function not reachable — check Edge Function deployment.)');
  }
  await loadProducts();
  loadOrders();
}

// ============ PRODUCTS MANAGER ============
async function loadProducts(){
  const { data } = await sb.from('products').select('*').order('created_at', { ascending: false });
  productsMap = {};
  (data || []).forEach(p => { productsMap[p.id] = p; });
  const list = document.getElementById('productsList');
  list.innerHTML = (data || []).map(p => `
    <div class="card">
      <div class="card-top">
        <h4>${p.title} <span style="font-size:11px; color:var(--gold);">[${p.category}]</span></h4>
        <button class="action-btn delete-btn" onclick="deleteProduct('${p.id}')">Delete</button>
      </div>
      <div style="font-size:12px; color:var(--chalk-dim); margin-bottom:6px;">${p.description || ''}</div>
      <div style="font-size:12px; color:var(--gold-bright);">
        PKR ${p.price_pkr} / $${p.price_usd}
        ${p.discount_percent > 0 ? `<span style="color:#4ade80;"> (${p.discount_percent}% OFF)</span>` : ''}
        | 🔥 Sold: ${p.sold_count || 0}
        | ${p.is_active ? '🟢 Active' : '🔴 Hidden'}
      </div>
      <button class="action-btn" style="margin-top:8px; background:var(--panel-2); color:var(--chalk); border:1px solid var(--line);" onclick="toggleActive('${p.id}', ${p.is_active})">${p.is_active ? 'Hide from site' : 'Show on site'}</button>
    </div>
  `).join('');
}

async function saveProduct(){
  const title = document.getElementById('pTitle').value.trim();
  const description = document.getElementById('pDesc').value.trim();
  const category = document.getElementById('pCategory').value;
  const price_pkr = parseInt(document.getElementById('pPricePkr').value) || 0;
  const price_usd = parseInt(document.getElementById('pPriceUsd').value) || 0;
  const discount_percent = parseInt(document.getElementById('pDiscount').value) || 0;

  if(!title){ alert('Title required'); return; }

  await sb.from('products').insert([{ title, description, category, price_pkr, price_usd, discount_percent }]);
  alert('Service Published to Website!');
  document.getElementById('pTitle').value = '';
  document.getElementById('pDesc').value = '';
  document.getElementById('pPricePkr').value = '';
  document.getElementById('pPriceUsd').value = '';
  document.getElementById('pDiscount').value = '';
  loadProducts();
}

async function toggleActive(id, current){
  await sb.from('products').update({ is_active: !current }).eq('id', id);
  loadProducts();
}

async function deleteProduct(id){
  if(confirm('Remove this service from website?')){
    await sb.from('products').delete().eq('id', id);
    loadProducts();
  }
}
</script>
</body>
</html>
